<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>OG: Airtable’s Ruby gem has not shipped code since 2016</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #0b0f17;
      color: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .stripe {
      position: absolute;
      left: 0; top: 0;
      width: 8px; height: 630px;
      background: #c79a4b;
    }
    .card {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 48px 64px 40px 88px;
      display: flex;
      flex-direction: column;
    }
    .kicker {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c79a4b;
      margin: 0 0 22px;
    }
    h1 {
      font-size: 62px;
      line-height: 1.04;
      letter-spacing: -0.032em;
      font-weight: 800;
      margin: 0 0 34px;
      max-width: 21ch;
    }
    .panel {
      box-sizing: border-box;
      width: 680px;
      background: #161b24;
      border: 1px solid #2c3444;
      border-radius: 12px;
      padding: 21px 30px;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                   "Liberation Mono", monospace;
      font-size: 28px;
      line-height: 1.34;
      white-space: pre;
    }
    .panel .hi { color: #c79a4b; }
    .foot {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .foot .line { font-size: 25px; font-weight: 500; color: #c5c9d1; }
    .foot .line b { color: #f4f5f7; font-weight: 700; }
    .foot .site { font-size: 25px; font-weight: 500; color: #6b717b; }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="card">
    <p class="kicker">26 August 2026</p>
    <h1>Airtable’s Ruby gem has not shipped code since 2016</h1>
    <div class="panel">last code commit     <span class="hi">15 Nov 2016</span>
gem airtable 0.0.9   <span class="hi">18 Oct 2016</span></div>
    <div class="foot">
      <span class="line">Nine years since the last release. <b>Now it needs a maintainer.</b></span>
      <span class="site">davidslv.uk</span>
    </div>
  </div>
</body>
</html>
