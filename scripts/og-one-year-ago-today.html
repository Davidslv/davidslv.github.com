<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>OG — One year ago today</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #f6f1e7;
      background-image:
        linear-gradient(rgba(30, 28, 25, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 28, 25, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      color: #1c1a17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 88px 96px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kicker {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c2410c;
      margin: 0 0 28px;
    }
    h1 {
      font-size: 88px;
      line-height: 0.98;
      letter-spacing: -0.035em;
      font-weight: 800;
      margin: 0 0 28px;
      max-width: 18ch;
    }
    .dek {
      font-size: 30px;
      line-height: 1.35;
      font-weight: 500;
      color: #3f3a34;
      margin: 0;
      max-width: 28ch;
    }
    .foot {
      margin-top: 56px;
      font-size: 22px;
      letter-spacing: 0.02em;
      color: #8a8278;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">18 August 2026</p>
    <h1>One year ago today</h1>
    <p class="dek">Let go on paternity leave. A year of building that I am keeping here, not on a feed.</p>
    <p class="foot">davidslv.uk · David Silva</p>
  </div>
</body>
</html>
